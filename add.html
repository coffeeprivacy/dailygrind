<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a friend on Daily Grind</title>
<meta name="description" content="Open Daily Grind to add a friend.">
<meta name="robots" content="noindex">
<style>
  :root { --bg: #6B3A1E; --bg2: #2E170A; --fg: #F6EBDD; --muted: rgba(246,235,221,.72); --card: rgba(255,255,255,.08); --accent: #D9A877; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: linear-gradient(var(--bg), var(--bg2)); color: var(--fg);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; max-width: 480px; margin: 0 auto; padding: 48px 16px; display: flex; flex-direction: column;
         align-items: center; justify-content: center; text-align: center; gap: 16px; }
  .cup { font-size: 56px; line-height: 1; }
  .brand { font-weight: 800; letter-spacing: .02em; color: var(--accent); }
  h1 { font-size: 1.8rem; line-height: 1.2; margin: 0; }
  p { margin: 0; color: var(--muted); }
  .button { display: block; width: 100%; padding: 15px 20px; border-radius: 14px; background: var(--fg); color: var(--bg2);
            font-weight: 700; text-decoration: none; }
  .card { width: 100%; background: var(--card); border-radius: 16px; padding: 16px; }
  .small { font-size: .9rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="cup" aria-hidden="true">☕️</div>
  <div class="brand">Daily Grind</div>
  <h1 id="title">Add a friend on Daily Grind</h1>
  <p id="sub">Track your caffeine, see how it hits your sleep, and share your cups with friends.</p>
  <a class="button" id="open" href="dailygrind://add">Open in Daily Grind</a>
  <div class="card">
    <p class="small">Don't have the app yet? Daily Grind is coming to the App Store soon. Once you have it, scan the code again or open this link.</p>
  </div>
  <p class="small"><a href="support.html">Help</a> · <a href="privacy.html">Privacy</a></p>
</main>
<script>
  // The username comes from the link (?u=name). Only safe characters are used, and it's set as text, never as HTML.
  const raw = new URLSearchParams(location.search).get("u") || "";
  const handle = raw.toLowerCase().replace(/^@+/, "");
  if (/^[a-z0-9._]{3,20}$/.test(handle)) {
    document.getElementById("title").textContent = "Add @" + handle + " on Daily Grind";
    document.getElementById("sub").textContent = "@" + handle + " wants to share their coffee with you.";
    document.getElementById("open").href = "dailygrind://add?u=" + encodeURIComponent(handle);
    document.title = "Add @" + handle + " on Daily Grind";
  }
</script>
</body>
</html>
